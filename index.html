*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.s{display:none;min-height:100vh;flex-direction:column}.s.on{display:flex}

.top select{flex:1}
#chat,.list{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:90%;padding:12px 14px;border-radius:16px;background:var(--card);line-height:1.4;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--ac);color:#fff}
.fix{background:#fff4e0;color:#1b2430;font-size:15px}.good{background:#e8f5e9;color:#1b2430;font-size:15px}
.big.sm{width:52px;height:52px;font-size:17px;font-weight:700}
.tip{background:#e3f0ff;color:#1b2430;font-size:16px}
.hid{display:none;color:var(--mut);font-size:15px;margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--card);padding:10px 12px 14px;display:flex;gap:10px;align-items:center}
.bar input{flex:1;font-size:16px}
.big{width:62px;height:62px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;flex:none}
.big.rec,.row button.rec{background:var(--r);color:#fff;animation:p 1s infinite}@keyframes p{50%{opacity:.7}}
.snd{padding:12px 15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:18px}
.cat{padding:18px;border:0;border-radius:14px;background:var(--card);color:var(--tx);font-size:18px;text-align:left}
.cat small{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.p{background:var(--card);border-radius:14px;padding:14px}.en{font-size:19px;font-weight:600;line-height:1.35}.ru{color:var(--mut);margin:4px 0 10px}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:20px}
.res{margin-top:10px;font-size:16px;line-height:1.5}.ok{color:var(--g);font-weight:600}.no{color:var(--r);font-weight:600}
.lnk{background:none;border:0;color:var(--ac);font-size:15px;padding:8px}

const ETO={"version":1,"audience":"ETO, tanker fleet","levels":["A2","B1","B2"],"status":"draft - requires review by a practising ETO","topics":[{"id":"onboard","title":"Знакомство на борту и обязанности","phrases":[{"en":"I'm the new Electro-Technical Officer.","ru":"Я новый электромеханик (ETO).","lvl":"A2"},{"en":"I report to the Chief Engineer.","ru":"Я подчиняюсь старшему механику.","lvl":"A2"},{"en":"I'm responsible for the ship's electrical and electronic systems.","ru":"Я отвечаю за судовые электрические и электронные системы.","lvl":"B1"},{"en":"Could you show me the electrical workshop?","ru":"Покажете мне электромастерскую?","lvl":"A2"},{"en":"Where are the electrical drawings kept?","ru":"Где хранятся электрические схемы?","lvl":"A2"},{"en":"Could you give me a handover of the ongoing jobs?","ru":"Можете передать мне текущие работы?","lvl":"B1"},{"en":"Which equipment has outstanding defects?","ru":"Какое оборудование имеет неустранённые дефекты?","lvl":"B1"},{"en":"Am I on day work or do I keep a watch?","ru":"Я на дневной работе или стою вахту?","lvl":"A2"}],"terms":[{"en":"electrical workshop","ru":"электромастерская"},{"en":"handover","ru":"передача дел"},{"en":"defect list","ru":"список дефектов"},{"en":"drawing","ru":"чертёж, схема"},{"en":"record book","ru":"журнал записей"},{"en":"spare part","ru":"запасная часть"}]},{"id":"power","title":"Электростанция и блэкаут","phrases":[{"en":"We have a blackout.","ru":"У нас блэкаут (полная потеря питания).","lvl":"A2"},{"en":"The main generator tripped on overcurrent.","ru":"Главный генератор отключился по перегрузке по току.","lvl":"B1"},{"en":"Start the standby generator.","ru":"Запустите резервный генератор.","lvl":"A2"},{"en":"The emergency generator started automatically.","ru":"Аварийный генератор запустился автоматически.","lvl":"A2"},{"en":"I am restoring power to the main switchboard.","ru":"Я восстанавливаю питание главного распределительного щита.","lvl":"B1"},{"en":"Check the cause before resetting the breaker.","ru":"Выясните причину, прежде чем включать автомат.","lvl":"B1"},{"en":"The generators are running in parallel.","ru":"Генераторы работают параллельно.","lvl":"B1"},{"en":"We need to reduce the load.","ru":"Нужно снизить нагрузку.","lvl":"A2"},{"en":"Power is restored.","ru":"Питание восстановлено.","lvl":"A2"}],"terms":[{"en":"blackout","ru":"полная потеря питания"},{"en":"main generator","ru":"главный генератор"},{"en":"emergency generator","ru":"аварийный генератор"},{"en":"load","ru":"нагрузка"},{"en":"busbar","ru":"шина"},{"en":"shore connection","ru":"питание с берега"}]},{"id":"switchboard","title":"Главный щит и защиты","phrases":[{"en":"Where is the main switchboard?","ru":"Где главный распределительный щит?","lvl":"A2"},{"en":"The circuit breaker has tripped.","ru":"Автоматический выключатель сработал.","lvl":"A2"},{"en":"Please check the protection settings.","ru":"Проверьте уставки защиты.","lvl":"B1"},{"en":"There is an earth fault on the 440-volt network.","ru":"На сети 440 вольт замыкание на землю.","lvl":"B1"},{"en":"The insulation resistance is low.","ru":"Сопротивление изоляции низкое.","lvl":"B1"},{"en":"Test the preferential trip.","ru":"Проверьте отключение неответственных потребителей (preferential trip).","lvl":"B2"},{"en":"Check the synchronising before closing the breaker.","ru":"Проверьте синхронизацию перед включением автомата.","lvl":"B2"}],"terms":[{"en":"circuit breaker","ru":"автоматический выключатель"},{"en":"fuse","ru":"предохранитель"},{"en":"relay","ru":"реле"},{"en":"transformer","ru":"трансформатор"},{"en":"earth fault","ru":"замыкание на землю"},{"en":"protection setting","ru":"уставка защиты"}]},{"id":"motors","title":"Двигатели и измерения","phrases":[{"en":"I will measure the insulation resistance with a megger.","ru":"Я измерю сопротивление изоляции мегомметром.","lvl":"B1"},{"en":"The reading is below the acceptable limit.","ru":"Показание ниже допустимого предела.","lvl":"B1"},{"en":"The motor is overheating.","ru":"Двигатель перегревается.","lvl":"A2"},{"en":"Check the motor winding temperature.","ru":"Проверьте температуру обмотки двигателя.","lvl":"B1"},{"en":"The motor draws too much current.","ru":"Двигатель потребляет слишком большой ток.","lvl":"B1"},{"en":"The bearing is noisy.","ru":"Подшипник шумит.","lvl":"A2"},{"en":"We need to replace the starter contactor.","ru":"Нужно заменить контактор пускателя.","lvl":"B1"},{"en":"Check the voltage and the frequency.","ru":"Проверьте напряжение и частоту.","lvl":"A2"}],"terms":[{"en":"winding","ru":"обмотка"},{"en":"bearing","ru":"подшипник"},{"en":"starter","ru":"пускатель"},{"en":"contactor","ru":"контактор"},{"en":"megger","ru":"мегомметр"},{"en":"insulation resistance","ru":"сопротивление изоляции"}]},{"id":"safety","title":"Безопасность, допуски, опасные зоны","phrases":[{"en":"Isolate and lock out the circuit before starting work.","ru":"Обесточьте и заблокируйте цепь перед началом работы.","lvl":"B1"},{"en":"Is this equipment certified for hazardous areas?","ru":"Это оборудование сертифицировано для опасных зон?","lvl":"B1"},{"en":"We need a Permit to Work for this job.","ru":"Для этой работы нужен наряд-допуск.","lvl":"B1"},{"en":"Please confirm that the circuit is dead.","ru":"Подтвердите, что цепь обесточена.","lvl":"B1"},{"en":"Use your personal protective equipment.","ru":"Используйте средства индивидуальной защиты.","lvl":"A2"},{"en":"Do not work on live equipment.","ru":"Не работайте на оборудовании под напряжением.","lvl":"A2"},{"en":"A gas test is required before entering the pump room.","ru":"Перед входом в насосное отделение нужна проверка на газ.","lvl":"B1"},{"en":"Hot work needs a fire watch.","ru":"Для огневых работ нужен пожарный наблюдатель.","lvl":"B1"}],"terms":[{"en":"Permit to Work","ru":"наряд-допуск"},{"en":"lockout / tagout","ru":"блокировка и бирка"},{"en":"PPE","ru":"средства индивидуальной защиты"},{"en":"hazardous area","ru":"опасная зона"},{"en":"intrinsically safe","ru":"искробезопасный"},{"en":"gas free","ru":"свободный от газа"}]},{"id":"automation","title":"Автоматика и сигнализация","phrases":[{"en":"The alarm is active.","ru":"Сигнализация активна.","lvl":"A2"},{"en":"Acknowledge the alarm.","ru":"Подтвердите (квитируйте) сигнал тревоги.","lvl":"B1"},{"en":"The sensor is faulty.","ru":"Датчик неисправен.","lvl":"A2"},{"en":"The reading is unstable.","ru":"Показания нестабильны.","lvl":"B1"},{"en":"Check the cable and the connector.","ru":"Проверьте кабель и разъём.","lvl":"A2"},{"en":"The PLC lost communication.","ru":"ПЛК потерял связь.","lvl":"B1"},{"en":"Reset the controller.","ru":"Сбросьте (перезагрузите) контроллер.","lvl":"B1"},{"en":"The system is in manual mode.","ru":"Система в ручном режиме.","lvl":"B1"}],"terms":[{"en":"sensor","ru":"датчик"},{"en":"alarm","ru":"сигнал тревоги"},{"en":"PLC","ru":"программируемый логический контроллер"},{"en":"controller","ru":"контроллер"},{"en":"setpoint","ru":"уставка"},{"en":"transmitter","ru":"измерительный преобразователь"}]},{"id":"psc","title":"Инспекции и записи","phrases":[{"en":"The inspector is on board.","ru":"Инспектор на борту.","lvl":"A2"},{"en":"I can show you the maintenance records.","ru":"Могу показать записи о техобслуживании.","lvl":"B1"},{"en":"The emergency lighting is tested every week.","ru":"Аварийное освещение проверяется каждую неделю.","lvl":"B1"},{"en":"All navigation lights are working.","ru":"Все ходовые огни исправны.","lvl":"A2"},{"en":"The deficiency will be rectified before departure.","ru":"Замечание будет устранено до выхода.","lvl":"B2"},{"en":"Here is the test report.","ru":"Вот протокол испытаний.","lvl":"A2"},{"en":"The equipment is covered by the planned maintenance system.","ru":"Оборудование включено в систему планового обслуживания.","lvl":"B1"}],"terms":[{"en":"inspector","ru":"инспектор"},{"en":"deficiency","ru":"замечание, несоответствие"},{"en":"records","ru":"записи, документация"},{"en":"certificate","ru":"свидетельство, сертификат"},{"en":"test report","ru":"протокол испытаний"},{"en":"planned maintenance system","ru":"система планового обслуживания"}]},{"id":"spares","title":"Дефекты, запчасти, доклад","phrases":[{"en":"Chief, we have a problem with the alternator.","ru":"Чиф, у нас проблема с генератором.","lvl":"B1"},{"en":"I need to order spare parts.","ru":"Мне нужно заказать запчасти.","lvl":"A2"},{"en":"Please send the part number and a quotation.","ru":"Пришлите номер детали и коммерческое предложение.","lvl":"B1"},{"en":"We need delivery to the next port.","ru":"Нужна доставка в следующий порт.","lvl":"A2"},{"en":"The repair will take about two hours.","ru":"Ремонт займёт около двух часов.","lvl":"A2"},{"en":"The fault was caused by a loose connection.","ru":"Причина неисправности: ослабленное соединение.","lvl":"B1"},{"en":"I will report when the job is finished.","ru":"Доложу, когда работа будет закончена.","lvl":"A2"},{"en":"The part is on order.","ru":"Деталь заказана.","lvl":"A2"}],"terms":[{"en":"requisition","ru":"заявка на снабжение"},{"en":"quotation","ru":"коммерческое предложение"},{"en":"part number","ru":"номер детали"},{"en":"supplier","ru":"поставщик"},{"en":"delivery","ru":"доставка"},{"en":"defect report","ru":"отчёт о дефекте"}]}]};
const M=ETO.topics.map(t=>[t.title,t.terms.length+" терминов",t.phrases.map(p=>[p.en,p.ru])]);

async function models(){
 if(MS)return MS;let l=[MODEL];

   }

  }

  let j;try{j=JSON.parse(raw)}catch(e){j={reply:raw}}
  H.push({role:"assistant",content:raw});w.remove();
  if(!silent){if(j.how){const t=bub("tip","💡 Скажите так:\n"+j.how+(j.note?"\n\n"+j.note:"")+"\n(нажмите — послушать)");t.onclick=()=>sayT(j.how.split(" / ")[0])}else j.fix?bub("fix","✏️ "+j.fix+(j.why?"\n"+j.why:"")):bub("good","✅ Отлично!")}
  const b=bub("",j.reply);if(j.ru){const p=document.createElement("div");p.className="hid";p.textContent=j.ru;b.appendChild(p);b.onclick=()=>p.style.display=p.style.display==="block"?"none":"block"}
  sayT(j.reply);
 }catch(e){H.pop();w.textContent="Ошибка: "+(navigator.onLine?e.message:"нет интернета")+(/key/i.test(e.message)?" — проверьте ключ (🔑 на стартовом экране)":/demand|overload|unavailable|quota/i.test(e.message)?"\nСерверы Google заняты. Попробуйте через пару минут. Библиотека фраз 📚 работает без ИИ.":"")}
 busy=false}
function sayT(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function aiSend(){const v=$("tx").value.trim();if(v){$("tx").value="";go(v)}}
function aiMic(l){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){bub("","Распознавание речи не поддерживается. Откройте в Chrome или пишите текстом.");return}
 if(rec){rec.stop();return}
 speechSynthesis.cancel();rec=new SR();rec.lang=l||"en-US";rec.interimResults=false;const b=$(l?"ar":"am");b.classList.add("rec");
 rec.onresult=e=>go(e.results[0][0].transcript);
 rec.onerror=e=>{if(e.error==="not-allowed")bub("","Разрешите микрофон в настройках Chrome.")};
 rec.onend=()=>{rec=null;b.classList.remove("rec")};rec.start()}

/* Библиотека фраз (работает без сети) */
function lib(){const S=mode?M:D;inCat=false;$("lt").textContent="Фразы";
 $("v").innerHTML=S.map((c,i)=>`<button class="cat" onclick="cat(${i})">${c[0]}<small>${c[1]} · ${c[2].length} фраз</small></button>`).join("");scr(2)}
function libBack(){inCat?lib():scr(1)}
function cat(i){const c=(mode?M:D)[i];L=c[2];inCat=true;$("lt").textContent=c[0];
 $("v").innerHTML=L.map((p,k)=>`<div class="p"><div class="en">${p[0]}</div><div class="ru">${p[1]}</div><div class="row"><button onclick="say(${k})">🔊</button><button id="m${k}" onclick="mic(${k})">🎤</button><button onclick="gt(L[${k}][0])">🌐</button></div><div class="res" id="r${k}"></div></div>`).join("");window.scrollTo(0,0)}
function say(i){sayT(L[i][0])}
function gt(t){window.open("https://translate.google.com/?sl=en&tl=ru&text="+encodeURIComponent(t)+"&op=translate","_blank")}
const nw=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function mic(i){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=$("r"+i);
 if(!SR){r.textContent="Распознавание речи не поддерживается. Откройте в Chrome.";return}
 if(rec){rec.stop();return}
 speechSynthesis.cancel();rec=new SR();rec.lang="en-US";rec.interimResults=false;const b=$("m"+i);b.classList.add("rec");r.textContent="Слушаю…";
 rec.onresult=e=>{const set=new Set(nw(e.results[0][0].transcript)),t=nw(L[i][0]);let k=0;
  const h=t.map(w=>set.has(w)?(k++,`<span class="ok">${w}</span>`):`<span class="no">${w}</span>`).join(" ");const pc=Math.round(100*k/t.length);
  r.innerHTML=h+`<br>${pc>=85?"✅ Отлично!":pc>=50?"👍 Почти, повторите красные слова":"🔁 Ещё раз, сначала нажмите 🔊"} (${pc}%)`};
 rec.onerror=e=>{r.textContent=e.error==="not-allowed"?"Разрешите микрофон в настройках Chrome.":"Не расслышал, попробуйте ещё раз."};
 rec.onend=()=>{rec=null;b.classList.remove("rec")};rec.start()}

/* Тренажёр: карточки с интервальным повторением */
const K1="srs",K2="st",ld=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let CARDS=[],Q=[],cur=null,SRSD={},ST={days:[],done:0};
const day=d=>(d||new Date()).toLocaleDateString("sv"),ttl=id=>ETO.topics.find(t=>t.id===id).title;
function openTrainer(){CARDS=[];ETO.topics.forEach(t=>{t.phrases.forEach(p=>CARDS.push({id:t.id+"|"+p.en,en:p.en,ru:p.ru,t:t.id}));t.terms.forEach(p=>CARDS.push({id:t.id+"|"+p.en,en:p.en,ru:p.ru,t:t.id}))});
 SRSD=ld(K1)||{};ST=ld(K2)||{days:[],done:0};
 $("tt").innerHTML='<option value="">Все темы</option>'+ETO.topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join("");tHome();scr(4)}
function streak(){let n=0;const s=new Set(ST.days),d=new Date();if(!s.has(day(d)))d.setDate(d.getDate()-1);while(s.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function tHome(msg){const L=CARDS.filter(c=>(SRSD[c.id]?.b||0)>=3).length,due=CARDS.filter(c=>SRSD[c.id]&&SRSD[c.id].d<=Date.now()).length;
 $("tb").innerHTML=(msg?`<div class="p">${msg}</div>`:"")+`<div class="p"><div class="en">Выучено: ${L} из ${CARDS.length}</div><div class="ru" style="margin:6px 0 0">Серия дней: ${streak()} · к повторению: ${due}</div></div><button class="mode g" onclick="tStart()">▶ Тренировка (10 карточек)</button><div class="mut">Видите перевод — скажите или вспомните фразу по-английски, затем отметьте «Знал» или «Не знал». Сложные карточки будут возвращаться чаще.</div>`}
function tStart(){const tp=$("tt").value,now=Date.now(),pool=CARDS.filter(c=>!tp||c.t===tp);
 const due=pool.filter(c=>SRSD[c.id]&&SRSD[c.id].d<=now).sort((a,b)=>SRSD[a.id].b-SRSD[b.id].b),fresh=pool.filter(c=>!SRSD[c.id]).sort(()=>Math.random()-.5);
 Q=due.slice(0,10);Q.push(...fresh.slice(0,10-Q.length));
 if(!Q.length){tHome("На сегодня здесь всё повторено 🎉 Загляните завтра или выберите другую тему.");return}
 Q=Q.map(c=>({...c}));tNext()}
function tNext(){cur=Q.shift();if(!cur){const n=ST.done;tHome("✅ Серия закончена. Всего карточек пройдено: "+n);return}
 $("tb").innerHTML=`<div class="mut">Осталось: ${Q.length+1} · ${ttl(cur.t)}</div><div class="p"><div class="en" style="font-size:24px">${cur.ru}</div><div class="ru" style="margin:10px 0 0">Скажите или вспомните по-английски</div></div><div class="row"><button id="tm" onclick="tMic()">🎤</button><button onclick="tShow()">👁 Показать</button></div><div class="res" id="tr"></div>`}
function tShow(h){sayT(cur.en);$("tr").innerHTML=(h||`<div class="en">${cur.en}</div>`)+`<div class="row" style="margin-top:12px"><button onclick="tRate(0)">❌ Не знал</button><button onclick="tRate(1)">✅ Знал</button></div>`}
function tMic(){const SRn=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SRn){tShow();return}
 if(rec){rec.stop();return}speechSynthesis.cancel();rec=new SRn();rec.lang="en-US";rec.interimResults=false;const b=$("tm");b.classList.add("rec");
 rec.onresult=e=>{const set=new Set(nw(e.results[0][0].transcript)),t=nw(cur.en);let k=0;const h=t.map(w=>set.has(w)?(k++,`<span class="ok">${w}</span>`):`<span class="no">${w}</span>`).join(" ");tShow(`<div class="en">${h}</div><div class="mut">Совпадение: ${Math.round(100*k/t.length)}%</div>`)};
 rec.onerror=()=>{};rec.onend=()=>{rec=null;b.classList.remove("rec")};rec.start()}
function tRate(ok){const r=SRSD[cur.id]||{b:0,d:0},iv=[0,1,2,4,8,16];
 if(ok){r.b=Math.min(5,r.b+1);r.d=Date.now()+iv[r.b]*864e5}else{r.b=1;r.d=Date.now();if(!cur.rt){cur.rt=1;Q.push(cur)}}
 SRSD[cur.id]=r;sv(K1,SRSD);ST.done++;const d=day();if(!ST.days.includes(d))ST.days.push(d);sv(K2,ST);tNext()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
