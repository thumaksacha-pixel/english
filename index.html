<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>English ETO</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--ac:#1f6feb;--mut:#6b7686;--g:#1e9e4a;--r:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--ac:#4c8dff;--mut:#93a0b2;--g:#46c071;--r:#ff6b60}}
*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.s{display:none;min-height:100vh;flex-direction:column}.s.on{display:flex}
#s0,#s3{padding:24px 16px;gap:14px;justify-content:center}
h1{margin:0;font-size:28px}.mut{color:var(--mut);font-size:15px}
.mode{padding:26px 18px;border:0;border-radius:18px;background:var(--ac);color:#fff;font-size:21px;text-align:left}
.mode.b{background:#0d3b66}.mode small{display:block;font-size:14px;opacity:.85;margin-top:6px}
.top{position:sticky;top:0;z-index:2;background:var(--card);padding:8px;display:flex;gap:6px}
.top button{padding:10px 12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:18px}
select,input{min-width:0;padding:11px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--tx);font-size:15px}
.top select{flex:1}
#chat,.list{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:90%;padding:12px 14px;border-radius:16px;background:var(--card);line-height:1.4;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--ac);color:#fff}
.fix{background:#fff4e0;color:#1b2430;font-size:15px}.good{background:#e8f5e9;color:#1b2430;font-size:15px}
.hid{display:none;color:var(--mut);font-size:15px;margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--card);padding:10px 12px 14px;display:flex;gap:10px;align-items:center}
.bar input{flex:1;font-size:16px}
.big{width:72px;height:72px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;flex:none}
.big.rec,.row button.rec{background:var(--r);color:#fff;animation:p 1s infinite}@keyframes p{50%{opacity:.7}}
.snd{padding:12px 15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:18px}
.cat{padding:18px;border:0;border-radius:14px;background:var(--card);color:var(--tx);font-size:18px;text-align:left}
.cat small{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.p{background:var(--card);border-radius:14px;padding:14px}.en{font-size:19px;font-weight:600;line-height:1.35}.ru{color:var(--mut);margin:4px 0 10px}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:20px}
.res{margin-top:10px;font-size:16px;line-height:1.5}.ok{color:var(--g);font-weight:600}.no{color:var(--r);font-weight:600}
.lnk{background:none;border:0;color:var(--ac);font-size:15px;padding:8px}
</style></head><body>

<div class="s on" id="s0">
 <h1>English Assistant</h1><div class="mut">Выберите режим — помощник сразу начнёт разговор</div>
 <button class="mode" onclick="start(0)">💬 Повседневный английский<small>Знакомство, магазин, врач, аэропорт</small></button>
 <button class="mode b" onclick="start(1)">⚓ Судовой электромеханик (ETO)<small>Блэкаут, PSC, Ex-зона, запчасти, доклад старшему механику</small></button>
 <button class="lnk" onclick="scr(3)">🔑 Ключ ИИ</button>
</div>

<div class="s" id="s3">
 <h1>Бесплатный ключ ИИ</h1>
 <div class="mut">Один раз: aistudio.google.com → Get API key → скопируйте и вставьте сюда. Ключ хранится только на этом телефоне.</div>
 <input id="kk" type="password" placeholder="AIza...">
 <button class="mode" onclick="sk()">Сохранить</button>
 <button class="lnk" onclick="scr(0)">← Назад</button>
</div>

<div class="s" id="s1">
 <div class="top"><button onclick="scr(0)">←</button><select id="sc" onchange="newChat()"></select><select id="lv" onchange="newChat()" style="flex:.5"><option>A2</option><option selected>B1</option><option>B2</option></select><button onclick="lib()">📚</button></div>
 <div id="chat"></div>
 <div class="bar"><button class="big" id="am" onclick="aiMic()">🎤</button><input id="tx" placeholder="или напишите" onkeydown="if(event.key==='Enter')aiSend()"><button class="snd" onclick="aiSend()">➤</button></div>
</div>

<div class="s" id="s2"><div class="top"><button onclick="libBack()">←</button><b style="align-self:center" id="lt">Фразы</b></div><div class="list" id="v"></div></div>

<script>
const D=[
["Знакомство","Как представиться и переспросить",[
["Nice to meet you.","Приятно познакомиться."],["My name is Alexander.","Меня зовут Александр."],["I'm from Ukraine.","Я из Украины."],["I work as a ship's electrician.","Я работаю судовым электриком."],["Could you speak more slowly, please?","Говорите, пожалуйста, медленнее."],["Could you repeat that, please?","Повторите, пожалуйста."],["I don't understand. Can you explain?","Я не понимаю. Можете объяснить?"],["How do you say this in English?","Как это сказать по-английски?"]]],
["Кафе и магазин","Покупки и оплата",[
["I'd like a coffee, please.","Я хотел бы кофе, пожалуйста."],["How much is it?","Сколько это стоит?"],["Can I pay by card?","Можно оплатить картой?"],["Do you have this in a bigger size?","Есть такое большего размера?"],["Where is the nearest pharmacy?","Где ближайшая аптека?"],["Could I have the bill, please?","Счёт, пожалуйста."]]],
["Врач","Самочувствие",[
["I don't feel well.","Я плохо себя чувствую."],["I have a headache.","У меня болит голова."],["I have a pain here.","У меня болит вот здесь."],["I need to see a doctor.","Мне нужно к врачу."],["How often should I take this medicine?","Как часто принимать это лекарство?"]]],
["Дорога и аэропорт","Путешествие",[
["Where is the check-in desk?","Где стойка регистрации?"],["Here is my passport.","Вот мой паспорт."],["I'm here for work.","Я здесь по работе."],["Which gate is it?","Какой это выход на посадку?"],["Where can I get a taxi?","Где можно взять такси?"],["My flight was delayed.","Мой рейс задержали."]]]];
const M=[
["Знакомство на борту","Первый день на судне",[
["I'm the new Electro-Technical Officer.","Я новый электромеханик (ETO)."],["Who is my immediate supervisor?","Кто мой непосредственный начальник?"],["Could you show me around the engine room?","Покажете мне машинное отделение?"],["Where is the main switchboard?","Где главный распределительный щит?"],["Where is the emergency generator located?","Где находится аварийный генератор?"],["Can I see the electrical drawings, please?","Можно посмотреть электрические схемы?"]]],
["Блэкаут","Отказ питания",[
["We have a blackout.","У нас блэкаут (потеря питания)."],["The main generator has tripped.","Главный генератор отключился по защите."],["Start the standby generator.","Запустите резервный генератор."],["The emergency generator is running.","Аварийный генератор работает."],["I am checking the main switchboard.","Я проверяю главный щит."],["Reset the breaker only after checking the cause.","Включайте автомат только после выяснения причины."],["Power is restored.","Питание восстановлено."]]],
["Измерения и ремонт","Мегомметр, защиты",[
["I will measure the insulation resistance with a megger.","Я измерю сопротивление изоляции мегомметром."],["The reading is below the acceptable limit.","Показание ниже допустимого предела."],["Isolate and lock out the circuit before work.","Обесточьте и заблокируйте цепь перед работой."],["Check the earth fault indication.","Проверьте индикацию замыкания на землю."],["The motor winding is damaged.","Обмотка двигателя повреждена."],["Test the alarm and trip settings.","Проверьте уставки сигнализации и отключения."],["The voltage is normal.","Напряжение в норме."]]],
["Грузовая зона и допуски","Ex-оборудование, Permit to Work",[
["Is this equipment certified for hazardous areas?","Это оборудование сертифицировано для опасных зон?"],["We need a Permit to Work for this job.","Для этой работы нужен наряд-допуск."],["Please check that the pump room is gas free.","Проверьте, что насосное отделение свободно от газа."],["Do not use non-certified equipment in the cargo area.","Не используйте несертифицированное оборудование в грузовой зоне."],["Lock out and tag out the circuit.","Заблокируйте цепь и повесьте бирку."],["A fire watch is required during hot work.","Во время огневых работ нужен пожарный наблюдатель."]]],
["Проверка PSC","Инспектор на борту",[
["The inspector is on board.","Инспектор на борту."],["I can show you the maintenance records.","Могу показать записи о техобслуживании."],["The emergency lighting was tested last week.","Аварийное освещение проверяли на прошлой неделе."],["All navigation lights are working.","Все ходовые огни исправны."],["This deficiency will be rectified before departure.","Это замечание будет устранено до выхода."],["Here is the test report.","Вот протокол испытаний."]]],
["Запчасти и доклад","Разговор со старшим механиком",[
["Chief, we have a problem with the alternator.","Чиф, у нас проблема с генератором."],["I need to order spare parts.","Мне нужно заказать запчасти."],["Please send me the part number and the quotation.","Пришлите номер детали и коммерческое предложение."],["Delivery to the next port, please.","Доставка в следующий порт, пожалуйста."],["The repair will take about two hours.","Ремонт займёт около двух часов."],["It was caused by a loose connection.","Причина: ослабленное соединение."],["I'll report back when the job is done.","Доложу, когда работа будет закончена."]]]];

const MODEL="gemini-3.8-flash"; // при ошибке модели замените на актуальную flash-модель из aistudio.google.com
const SC=[["Свободный разговор","Знакомство","Кафе и магазин","Врач","Аэропорт и виза","Поиск жилья"],["Свободный разговор о работе","Блэкаут: разговор со старшим механиком","Проверка PSC","Ex-зона и Permit to Work","Заказ запчастей","Первый день на судне","Мегомметр и ремонт"]];
let mode=0,rec=null,busy=false,H=[],L=[],inCat=false;
const $=id=>document.getElementById(id);
const gk=()=>{try{return localStorage.getItem("k")||""}catch(e){return ""}};
function scr(n){document.querySelectorAll(".s").forEach((e,i)=>e.classList.toggle("on",e.id==="s"+n));window.scrollTo(0,0)}
function sk(){const v=$("kk").value.trim();if(v){try{localStorage.setItem("k",v)}catch(e){}$("kk").value="";scr(0)}}
function start(m){mode=m;if(!gk()){scr(3);return}
 $("sc").innerHTML=SC[m].map((s,i)=>`<option value="${i}">${s}</option>`).join("");scr(1);newChat()}
function newChat(){H=[];$("chat").innerHTML="";go("(Start with a short greeting and your first question for the scenario.)",true)}
function sysP(){const sc=SC[mode][$("sc").value||0],lv=$("lv").value;
 return `You are a friendly, patient English tutor and role-play partner. Learner: Russian speaker, level ${lv}`+(mode?", a ship's electrical engineer (ETO) on tankers. Use real shipboard English (SOLAS, MARPOL, ISM, IEC, SMCP, switchboard, megger, AVR, Ex-equipment, PSC). Play the other party (chief engineer, captain, PSC inspector, supplier) as needed.":", who needs everyday conversation.")+` Scenario: ${sc}. Reply in 1-3 short sentences at ${lv} level and end with one question. Return ONLY JSON: {"reply":"English reply","fix":"corrected version of the learner's last sentence or empty string","why":"short explanation of the mistake in Russian or empty","ru":"Russian translation of your reply"}`}
function bub(c,t){const d=document.createElement("div");d.className="b "+c;d.textContent=t;$("chat").appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
async function go(text,silent){
 if(busy)return;busy=true;if(!silent)bub("me",text);H.push({role:"user",content:text});const w=bub("","…");
 try{
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent?key="+encodeURIComponent(gk()),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sysP()}]},contents:H.map(h=>({role:h.role==="assistant"?"model":"user",parts:[{text:h.content}]})),generationConfig:{responseMimeType:"application/json",maxOutputTokens:600}})});
  const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);
  const raw=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("").replace(/```json|```/g,"").trim();
  let j;try{j=JSON.parse(raw)}catch(e){j={reply:raw}}
  H.push({role:"assistant",content:raw});w.remove();
  if(!silent)j.fix?bub("fix","✏️ "+j.fix+(j.why?"\n"+j.why:"")):bub("good","✅ Отлично!");
  const b=bub("",j.reply);if(j.ru){const p=document.createElement("div");p.className="hid";p.textContent=j.ru;b.appendChild(p);b.onclick=()=>p.style.display=p.style.display==="block"?"none":"block"}
  sayT(j.reply);
 }catch(e){w.textContent="Ошибка: "+(navigator.onLine?e.message:"нет интернета")+(/key/i.test(e.message)?" — проверьте ключ (🔑 на стартовом экране)":"")}
 busy=false}
function sayT(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function aiSend(){const v=$("tx").value.trim();if(v){$("tx").value="";go(v)}}
function aiMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){bub("","Распознавание речи не поддерживается. Откройте в Chrome или пишите текстом.");return}
 if(rec){rec.stop();return}
 speechSynthesis.cancel();rec=new SR();rec.lang="en-US";rec.interimResults=false;const b=$("am");b.classList.add("rec");
 rec.onresult=e=>go(e.results[0][0].transcript);
 rec.onerror=e=>{if(e.error==="not-allowed")bub("","Разрешите микрофон в настройках Chrome.")};
 rec.onend=()=>{rec=null;b.classList.remove("rec")};rec.start()}

/* Библиотека фраз (работает без сети) */
function lib(){const S=mode?M:D;inCat=false;$("lt").textContent="Фразы";
 $("v").innerHTML=S.map((c,i)=>`<button class="cat" onclick="cat(${i})">${c[0]}<small>${c[1]} · ${c[2].length} фраз</small></button>`).join("");scr(2)}
function libBack(){inCat?lib():scr(1)}
function cat(i){const c=(mode?M:D)[i];L=c[2];inCat=true;$("lt").textContent=c[0];
 $("v").innerHTML=L.map((p,k)=>`<div class="p"><div class="en">${p[0]}</div><div class="ru">${p[1]}</div><div class="row"><button onclick="say(${k})">🔊</button><button id="m${k}" onclick="mic(${k})">🎤</button><button onclick="gt(L[${k}][0])">🌐</button></div><div class="res" id="r${k}"></div></div>`).join("");window.scrollTo(0,0)}
function say(i){sayT(L[i][0])}
function gt(t){window.open("https://translate.google.com/?sl=en&tl=ru&text="+encodeURIComponent(t)+"&op=translate","_blank")}
const nw=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function mic(i){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=$("r"+i);
 if(!SR){r.textContent="Распознавание речи не поддерживается. Откройте в Chrome.";return}
 if(rec){rec.stop();return}
 speechSynthesis.cancel();rec=new SR();rec.lang="en-US";rec.interimResults=false;const b=$("m"+i);b.classList.add("rec");r.textContent="Слушаю…";
 rec.onresult=e=>{const set=new Set(nw(e.results[0][0].transcript)),t=nw(L[i][0]);let k=0;
  const h=t.map(w=>set.has(w)?(k++,`<span class="ok">${w}</span>`):`<span class="no">${w}</span>`).join(" ");const pc=Math.round(100*k/t.length);
  r.innerHTML=h+`<br>${pc>=85?"✅ Отлично!":pc>=50?"👍 Почти, повторите красные слова":"🔁 Ещё раз, сначала нажмите 🔊"} (${pc}%)`};
 rec.onerror=e=>{r.textContent=e.error==="not-allowed"?"Разрешите микрофон в настройках Chrome.":"Не расслышал, попробуйте ещё раз."};
 rec.onend=()=>{rec=null;b.classList.remove("rec")};rec.start()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
